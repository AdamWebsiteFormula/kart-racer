 * to the body (min and 5th percentile, m). seat: Hips + UpLegs; feet: Foot + ToeBase; hands; head.
 */
window.contact = (step = 2) => {
  let mesh = null; window.driver.traverse((m) => { if (m.isSkinnedMesh && !mesh) mesh = m; });
  window.root.updateMatrixWorld(true);
  const groups = { seat: ['Hips', 'LeftUpLeg', 'RightUpLeg'], legs: ['LeftLeg', 'RightLeg'], feet: ['LeftFoot', 'RightFoot', 'LeftToeBase', 'RightToeBase'], hands: ['LeftHand', 'RightHand'], arms: ['LeftArm', 'RightArm', 'LeftForeArm', 'RightForeArm'], torso: ['Spine', 'Spine01', 'Spine02', 'LeftShoulder', 'RightShoulder'], head: ['neck', 'Head', 'head_end', 'headfront'] };
  const of = {}; for (const [g, list] of Object.entries(groups)) for (const b of list) of[b] = g;
  const SI = mesh.geometry.attributes.skinIndex, SW = mesh.geometry.attributes.skinWeight, bones = mesh.skeleton.bones;
  const rc = new THREE.Raycaster(), v = new THREE.Vector3(), res = {};
  for (let i = 0; i < mesh.geometry.attributes.position.count; i += step) {
    let bi = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = SW.getComponent(i, k); if (w > bw) { bw = w; bi = SI.getComponent(i, k); } }
    const g = of[bones[bi].name]; if (!g) continue;
    mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld);
    const r = res[g] ?? (res[g] = { n: 0, inside: 0, gaps: [], at: [] }); r.n++;
    let odd = 0;
    for (const d of [[0, 1, 0], [0, -1, 0], [1, 0, 0], [-1, 0, 0]]) { rc.set(v, V3(d)); rc.far = 5; if (rc.intersectObject(window.bodyObj, true).length % 2 === 1) odd++; }
    if (odd >= 3) { r.inside++; if (r.at.length < 4) r.at.push(r3(v)); continue; }
    rc.set(v, V3([0, -1, 0])); rc.far = 0.5; rc.firstHitOnly = true;
    const h = rc.intersectObject(window.bodyObj, true)[0]; rc.firstHitOnly = false;
    if (h) r.gaps.push(h.distance);
  }
  const out = {};
  for (const [g, r] of Object.entries(res)) { r.gaps.sort((a, b) => a - b); out[g] = { n: r.n, inside: r.inside, minGap: r.gaps.length ? +r.gaps[0].toFixed(3) : null, p5: r.gaps.length ? +r.gaps[Math.floor(r.gaps.length * 0.05)].toFixed(3) : null, at: r.at }; }
  return out;
};

/**
 * Tune a steering spec so the game's cut takes the whole rim: among the body's DARK vertices near the
 * wheel (within 0.12 of its plane, radius ± 0.08 of the rim's middle), count those the cut takes
 * (|along| ≤ 0.04, across ≤ radius + 0.045); turn the axis (± deg in steps) and slide the centre along
 * it (± 1.5 cm) to take the most. Returns the best spec, what it takes and what it leaves in the ring.
 */
window.steerOpt = (st, o = {}) => {
  const verts = bodyVerts().filter((p) => p[3]);
  const C0 = V3(st.center), n0 = V3(st.axis).normalize();
  const near = verts.map((p) => V3(p.slice(0, 3))).filter((p) => p.distanceTo(C0) < st.radius + 0.15);
  const score = (c, n, r) => {
    let take = 0, ring = 0, extra = 0;
    for (const p of near) {
      const d = p.clone().sub(c), al = d.dot(n), ac = Math.sqrt(Math.max(0, d.lengthSq() - al * al));
      const inCut = Math.abs(al) <= 0.04 && ac <= r + 0.045;
      const inRing = Math.abs(al) <= 0.12 && Math.abs(ac - r) <= 0.08;
      if (inRing) { ring++; if (inCut) take++; } else if (inCut) extra++;
    }
    return { take, ring, extra };
  };
  const a = Math.abs(n0.y) < 0.9 ? V3([0, 1, 0]) : V3([1, 0, 0]);
  const u = new THREE.Vector3().crossVectors(n0, a).normalize(), v = new THREE.Vector3().crossVectors(n0, u);
  let best = null; const deg = o.deg ?? 4, step = o.step ?? 1;
  for (let i = -deg; i <= deg; i += step) for (let j = -deg; j <= deg; j += step) for (let s = -0.015; s <= 0.0151; s += 0.005) {
    const n = n0.clone().applyAxisAngle(u, i * DEG).applyAxisAngle(v, j * DEG).normalize();
    const c = C0.clone().addScaledVector(n, s);
    const sc = score(c, n, st.radius);
    if (!best || sc.take > best.sc.take || (sc.take === best.sc.take && sc.extra < best.sc.extra)) best = { c, n, sc, i, j, s };
  }
  const base = score(C0, n0, st.radius);
  return { base, best: best.sc, turn: [best.i, best.j], slide: +best.s.toFixed(3), spec: { center: r3(best.c), axis: best.n.toArray().map((x) => +x.toFixed(3)), radius: st.radius } };
};

/** The dark vertices in the rim's ring that the game's cut leaves behind: [along, across, position] (a sample), and a histogram of along. */
window.steerLeft = (st) => {
  const c = V3(st.center), n = V3(st.axis).normalize(), out = [], hist = {};
  for (const p of bodyVerts().filter((q) => q[3])) {
    const d = V3(p.slice(0, 3)).sub(c), al = d.dot(n), ac = Math.sqrt(Math.max(0, d.lengthSq() - al * al));
    const inCut = Math.abs(al) <= 0.04 && ac <= st.radius + 0.045, inRing = Math.abs(al) <= 0.12 && Math.abs(ac - st.radius) <= 0.08;
    if (inRing && !inCut) { out.push([+al.toFixed(3), +ac.toFixed(3), p.slice(0, 3).map((x) => +x.toFixed(3))]); const k = (Math.round(al * 50) / 50).toFixed(2); hist[k] = (hist[k] ?? 0) + 1; }
  }
  return { n: out.length, hist, sample: out.filter((_, i) => i % Math.max(1, Math.floor(out.length / 10)) === 0).slice(0, 10) };
};

/** Driver vertices outside the body's hull but below `yMax` and farther than `rMin` (x-z) from the seat: where a tail or coat pokes out. Grouped by main bone, with their extent. */
window.poke = (yMax, o = {}) => {
  let mesh = null; window.driver.traverse((m) => { if (m.isSkinnedMesh && !mesh) mesh = m; });
  window.root.updateMatrixWorld(true);
  const SI = mesh.geometry.attributes.skinIndex, SW = mesh.geometry.attributes.skinWeight, bones = mesh.skeleton.bones;
  const v = new THREE.Vector3(), rc = new THREE.Raycaster(), out = {};
  for (let i = 0; i < mesh.geometry.attributes.position.count; i += (o.step ?? 2)) {
    mesh.getVertexPosition(i, v); v.applyMatrix4(mesh.matrixWorld);
    if (v.y > yMax) continue;
    // outside the hull: a ray sideways (away from the centre line) meets no body
    const sx = v.x >= 0 ? 1 : -1; rc.set(v, V3([sx, 0, 0])); rc.far = 3; rc.firstHitOnly = true;
    const side = rc.intersectObject(window.bodyObj, true).length;
    rc.set(v, V3([0, -1, 0])); const down = rc.intersectObject(window.bodyObj, true).length;
    if (side && down) continue;
    let bi = 0, bw = -1; for (let k = 0; k < 4; k++) { const w = SW.getComponent(i, k); if (w > bw) { bw = w; bi = SI.getComponent(i, k); } }
    const name = bones[bi].name, e = out[name] ?? (out[name] = { n: 0, min: [9, 9, 9], max: [-9, -9, -9], w: [] });
    e.n++; for (let k = 0; k < 3; k++) { e.min[k] = Math.min(e.min[k], v.getComponent(k)); e.max[k] = Math.max(e.max[k], v.getComponent(k)); }
    if (e.w.length < 3) { const ws = []; for (let k = 0; k < 4; k++) { const w = SW.getComponent(i, k); if (w > 0.01) ws.push(bones[SI.getComponent(i, k)].name + ':' + w.toFixed(2)); } e.w.push(ws.join(' ')); }
  }
  for (const e of Object.values(out)) { e.min = e.min.map((x) => +x.toFixed(3)); e.max = e.max.map((x) => +x.toFixed(3)); }
  return out;
};
/** The game's own chase framing: 5.5 m back, 2.4 m up, looking 6 m ahead and 1.5 m up, 60° (src/game/camera.ts). */
window.gameChase = (o = {}) => {
  const [w, h] = o.size ?? [1600, 900];
  renderer.setSize(w, h); cam.aspect = w / h; cam.fov = 60; cam.updateProjectionMatrix();
  cam.position.set(0, 2.4, -5.5); cam.lookAt(0, 1.5, 6); cam.updateMatrixWorld(true);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL('image/jpeg', 0.9);
  renderer.setSize(W, H); cam.aspect = W / H; cam.fov = 30; cam.updateProjectionMatrix();
  return url;
};
window.ready = true;
</script></body></html>
