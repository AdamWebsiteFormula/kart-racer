<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages sends no security headers, so the policy is set here, before anything loads (red-team 24 Sept 2026):
         scripts from this site only (no inline code, no eval); inline styles (Vite's dev CSS, style attributes); images, fonts
         and fetches from here plus data: and blob: (textures inside the GLB models, small font files); the network reaches
         this site and the leaderboard (src/backend-leaderboard/config.ts) and nothing else. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob: https://thuvqdejckcphwuooyhx.supabase.co; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Rascal Rally!</title>
    <meta name="description" content="A bright cartoon kart racer for the browser. Eight original racers drift, boost and trade items, and on every final lap the track fights back." />
    <meta name="theme-color" content="#1b1b2f" />
    <!-- the loading screen's look: bundled into the page's one stylesheet (performance/splash.css) -->
    <link rel="stylesheet" href="/src/performance/splash.css" />
  </head>
  <body>
    <!-- The loading screen: painted with the page, before the game's script arrives; the script fades it
         out when the title screen is up (performance/splash.ts). The tip is How to Play's first (ui-hud data/howto.ts). -->
    <div id="splash" role="status" aria-busy="true" aria-label="Loading Rascal Rally!">
      <div class="splash-logo" aria-hidden="true"><span class="l1">Rascal</span><span class="l2">Rally!</span></div>
      <div class="splash-bar" aria-hidden="true"><span></span></div>
      <p class="splash-label">Loading…</p>
      <p class="splash-tip"><b>Tip</b>Hold drift through a turn: the sparks go blue, orange, then purple. Let go for a boost.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
